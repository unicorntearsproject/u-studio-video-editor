# Snap package for u Studio Video Editor (docs/developer/packaging.md).
#
# Strict confinement on core24 with the gnome extension (GNOME 46:
# GTK 4.14 and libadwaita 1.5, the newest the app's symbols need).
# MLT 7.40, FFmpeg with x264, and x264 are built here as parts, exactly as
# in the Flatpak (packaging/flatpak/modules/): distros ship older MLT, and
# no base snap has an H.264 encoder. Only the MLT modules the app requests
# are built; every Qt one is off (ADR-007).
#
# DRAFT: not built yet (snapcraft and LXD aren't installed on the build
# machine), and the snap name isn't registered. See packaging.md.
# Still to add, to match the Flatpak (ADR-019, GPU compositing; stage G5): Eigen
# (build only) and movit 1.7.2 parts before mlt, and -DMOD_MOVIT=ON
# (packaging/flatpak/modules/{eigen,movit}.yml), the MLT movit.convert leak
# patch (packaging/flatpak/patches/); FFTW and libepoxy from
# core24's archive, Mesa from the gnome extension's gpu-2404.

name: u-studio-video-editor # TODO: the registered snap name (owner question 12)
title: U-Stu Video Editor
summary: Multi-track video editor for livestream and promo editing
description: |
  u Studio is a multi-track video editor for GNOME, made for livestream
  and promo editing at 1080p and 4K: cut, trim and arrange clips on any
  number of video and audio tracks, place and transform pictures on the
  preview, make proxies for heavy footage, and export H.264 MP4.
license: GPL-2.0-or-later # the snap as a whole: x264 and FFmpeg --enable-gpl; the app itself is MIT
icon: data/icons/hicolor/scalable/apps/com.ustudio.VideoEditor.svg
adopt-info: u-studio-video-editor
base: core24
grade: devel # stable once a release is declared stable
confinement: strict
platforms:
  amd64:

apps:
  u-studio-video-editor:
    command: usr/bin/u-studio-video-editor
    extensions: [gnome]
    desktop: usr/share/applications/com.ustudio.VideoEditor.desktop
    common-id: com.ustudio.VideoEditor
    plugs:
      - home            # footage and projects in the home folder (not hidden dirs)
      - removable-media # /media, /run/media, /mnt
      - audio-playback  # sdl2_audio through PulseAudio/PipeWire
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}

# The app bakes MLT's module directory in at build time (pkg-config's
# moduledir: /usr/lib/<triplet>/mlt-7, since the parts install with prefix
# /usr), and MLT looks for its profiles and presets under /usr/share/mlt-7.
# These layouts put the snap's copies at those paths inside the snap's
# mount namespace, so FactoryPolicy's curated directory (ADR-007) works
# unchanged. The triplet is literal: this draft is amd64 only.
layout:
  /usr/lib/x86_64-linux-gnu/mlt-7:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/mlt-7
  /usr/share/mlt-7:
    bind: $SNAP/usr/share/mlt-7

parts:
  x264:
    plugin: autotools
    source: https://code.videolan.org/videolan/x264.git
    source-commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55 # same as packaging/flatpak/modules/x264.yml
    autotools-configure-parameters: [--prefix=/usr, --enable-shared, --enable-pic, --disable-cli]
    build-packages: [nasm]

  ffmpeg:
    after: [x264]
    plugin: autotools
    source: https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
    source-checksum: sha256/7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
    autotools-configure-parameters:
      - --prefix=/usr
      - --enable-gpl
      - --enable-shared
      - --disable-static
      - --enable-pic
      - --disable-programs
      - --disable-doc
      - --disable-avdevice
      - --disable-network
      - --enable-libx264
      - --enable-libdav1d
      - --enable-vaapi
    build-packages: [nasm, libdav1d-dev, libva-dev]
    stage-packages: [libdav1d7, libva2, libva-drm2, libva-x11-2]

  mlt:
    after: [ffmpeg]
    plugin: cmake
    source: https://github.com/mltframework/mlt/releases/download/v7.40.0/mlt-7.40.0.tar.gz
    source-checksum: sha256/f11c30e21670f62a3dfc56a31306ac02f3feea00908a2821a4a0bf3e989d3d6a
    # Same module selection as packaging/flatpak/modules/mlt.yml; see there
    # for which service each module provides.
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DGPL=ON
      - -DGPL3=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_TESTS_WITH_QT6=OFF
      - -DBUILD_DOCS=OFF
      - -DCLANG_FORMAT=OFF
      - -DMOD_AVFORMAT=ON
      - -DUSE_AVDEVICE=OFF
      - -DMOD_XML=ON
      - -DMOD_SDL2=ON
      - -DMOD_RTAUDIO=ON
      - -DMOD_GDK=ON
      - -DMOD_RESAMPLE=ON
      - -DMOD_NORMALIZE=ON
      - -DMOD_PLUS=ON
      - -DCMAKE_DISABLE_FIND_PACKAGE_FFTW3=ON
      - -DMOD_QT6=OFF
      - -DMOD_GLAXNIMATE_QT6=OFF
      - -DMOD_DECKLINK=OFF
      - -DMOD_FREI0R=OFF
      - -DMOD_JACKRACK=OFF
      - -DUSE_LV2=OFF
      - -DUSE_VST2=OFF
      - -DMOD_KDENLIVE=OFF
      - -DMOD_MOVIT=OFF
      - -DMOD_NDI=OFF
      - -DMOD_OLDFILM=OFF
      - -DMOD_OPENCV=OFF
      - -DMOD_OPENFX=OFF
      - -DMOD_PLUSGPL=OFF
      - -DMOD_RUBBERBAND=OFF
      - -DMOD_RNNOISE=OFF
      - -DMOD_SDL1=OFF
      - -DMOD_SOX=OFF
      - -DMOD_SPATIALAUDIO=OFF
      - -DMOD_VIDSTAB=OFF
      - -DMOD_VORBIS=OFF
      - -DMOD_XINE=ON # the loader's deinterlace normaliser (see packaging/flatpak/modules/mlt.yml)
    build-packages: [libsdl2-dev, libsamplerate0-dev, libasound2-dev, libpulse-dev]
    stage-packages: [libsdl2-2.0-0, libsamplerate0]
    prime:
      - -usr/bin # melt: not needed at run time

  u-studio-video-editor:
    after: [mlt]
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - -Dbuildtype=release
      - -Dtests=disabled
      - -Drender_tool=true
    build-packages: [g++, libxml2-dev]
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n "s/^  version: '\(.*\)',$/\1/p" meson.build)"
    override-prime: |
      craftctl default
      # Nothing from a test run or the build machine may ship.
      python3 "$CRAFT_PROJECT_DIR/tools/check_bundle_clean.py" "$CRAFT_PRIME"
